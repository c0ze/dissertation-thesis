name: CI

# Quoted so YAML 1.1 parsers don't coerce bare `on` to boolean true.
"on":
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs on the same ref when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c-tests:
    # New sparse-gate library at implementation/c/. Builds the qreg
    # primitives, all gates, QFT, Grover, Shor, and the demo binary,
    # then runs every tests/test_*.c at NP = 1, 2, 4 via `make test`.
    name: implementation/c — make test (NP=1,2,4)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenMPI and build essentials
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential libopenmpi-dev openmpi-bin

      - name: Show toolchain versions
        run: |
          mpicc --version | head -1
          mpirun --version | head -1
          make --version | head -1

      - name: Build and test
        working-directory: implementation/c
        run: |
          make
          make test

      - name: Run a couple of demos as smoke tests
        working-directory: implementation/c
        run: |
          mpirun --oversubscribe -n 4 build/bin/qubit --algo bell
          mpirun --oversubscribe -n 4 build/bin/qubit --algo qft
          mpirun --oversubscribe -n 4 build/bin/qubit --algo grover
          mpirun --oversubscribe -n 1 build/bin/qubit --algo shor

  c-tests-large:
    # Re-run the full /c test suite at NP=8 to catch any rank-count
    # bugs that only show up with deeper partitioning.
    name: implementation/c — make test-large (NP=1,2,4,8)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenMPI and build essentials
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential libopenmpi-dev openmpi-bin

      - name: Build and run test-large
        working-directory: implementation/c
        run: |
          make
          make test-large

  original-build-check:
    # The 2004 dense-matrix library lives at implementation/original/.
    # It is preserved as a historical artifact, but we still want CI to
    # verify it builds + the bundled make check passes (Bell-state
    # smoke test at NP=4) so toolchain rot doesn't go unnoticed.
    name: implementation/original — make check (NP=4)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenMPI and build essentials
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential libopenmpi-dev openmpi-bin

      - name: Build and run check
        working-directory: implementation/original
        run: |
          make
          make check

      - name: Verify the non-power-of-two NP guard fails fast
        working-directory: implementation/original
        # GitHub Actions runs each `run:` step under bash with
        # `-e -o pipefail`. Without disabling -e around the failing
        # command substitution, the step would abort BEFORE we get a
        # chance to capture rc and inspect the output. The +e/-e
        # toggle confines the leniency to the one command we expect
        # to fail; everything around it keeps strict-mode semantics.
        shell: bash
        run: |
          set +e
          out=$(make run NP=3 2>&1)
          rc=$?
          set -e
          echo "$out"
          echo "exit code: $rc"
          if [ "$rc" -eq 0 ]; then
            echo "FAIL: NP=3 unexpectedly succeeded"
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q "unsafe for this demo"; then
            echo "FAIL: NP=3 did not surface the unsafe-NP guard text"
            exit 1
          fi
          echo "OK: makefile guard emitted the expected error and non-zero exit"

  go-tests:
    name: implementation/go -- make test + test-race
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: go build
        working-directory: implementation/go
        run: go build ./...
      - name: go vet
        working-directory: implementation/go
        run: go vet ./...
      - name: go test
        working-directory: implementation/go
        run: go test ./...
      - name: go test -race
        working-directory: implementation/go
        run: go test -race ./...

  go-tests-shor-21:
    name: implementation/go -- Shor-21 large test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: go test with RUN_SHOR_21=1
        working-directory: implementation/go
        run: RUN_SHOR_21=1 go test ./qubit/ -run TestShorPeriodA2Mod21 -v
